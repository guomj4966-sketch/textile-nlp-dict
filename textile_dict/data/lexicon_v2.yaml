      新闻发布会:
        definition: 党政机关向新闻媒体发布政策信息并接受提问的会议。
      新闻发布:
        definition: 党政机关通过媒体向社会公开传达重要信息的活动。
      答记者问:
        definition: 政府官员就媒体提问进行回答的政策解读形式。
      国新办吹风会:
        definition: 国务院新闻办公室向记者介绍政策背景的新闻吹风会。
      国务院政策例行吹风会:
        definition: 国新办定期举办的例行政策解读会议。
      国新办举行:
        definition: 国务院新闻办公室举办的新闻发布会或吹风会。
      国新办就:
        definition: 国务院新闻办公室就某一主题召开的发布会。
      新华时评:
        definition: 新华社发表的时事评论文章，代表官方立场。
      评论员文章:
        definition: 新闻机构评论员撰写的署名评论文章。
      社论:
        definition: 报社就重大事件发表的代表媒体立场的评论文章。
      人民日报评论:
        definition: 《人民日报》发表的具有重要舆论导向的评论。
      学习问答:
        definition: 以问答形式学习政策知识的传播方式。
      专家解读文章之:
        definition: 由行业专家撰写的政策解读文章。
      图解:
        definition: 以图片图表为主对政策进行可视化解读的传播方式。
      一图读懂:
        definition: 用单张信息图概括政策核心内容的极简图解。
      动漫:
        definition: 以动画漫画进行政策解读和科普宣传的传播方式。
      H5:
        definition: 基于HTML5技术的交互式新媒体传播页面。
      视频:
        definition: 以视频形式进行政策宣传解读的传播方式。
      海报:
        definition: 以海报形式进行政策宣传和科普教育的传播方式。
      长图:
        definition: 以纵向长图呈现信息的可视化内容形式。
      速览:
        definition: 对政策核心要点进行快速摘要的解读形式。
      划重点:
        definition: 对政策中重点条目进行标注和提炼的解读方式。
      快看:
        definition: 面向移动端的快速可读政策解读。
      数读:
        definition: 以数据图表为主的政策解读方式。
      图说:
        definition: 以图表为主文字为辅的政策解读方式。
      一图速览:
        definition: 一张图快速了解政策全貌的极简形式。
      建议的答复:
        definition: 政府部门对人大代表建议的正式书面回复。
      提案的答复:
        definition: 政府部门对政协提案的正式书面回复。
      人大建议:
        definition: 人大会议期间代表提交的议案或建议。
      政协提案:
        definition: 政协会议期间委员提交的提案。
