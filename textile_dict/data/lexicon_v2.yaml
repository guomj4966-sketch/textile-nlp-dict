        definition: 在生产生活中减少二氧化碳等温室气体排放的理念和实践。
      智能制造:
        definition: 基于信息技术与制造技术深度融合的新型生产方式。
      碳中和:
        definition: 通过碳减排和碳抵消实现二氧化碳净零排放。中国承诺2060年前实现。
      碳达峰:
        definition: 碳排放量达历史峰值后进入下降通道的拐点。
      半导体:
        definition: 导电性能介于导体和绝缘体之间的电子材料。
      芯片:
        definition: 内含集成电路的半导体元件。
      集成电路:
        definition: 将电子元件集成在半导体晶片上的微型电子器件。
      光伏:
        definition: 利用太阳能电池将太阳光直接转换为电能的技术。
      风电:
        definition: 利用风力驱动发电机组将风能转换为电能的技术。
      动漫:
        definition: 以动画漫画进行政策解读和科普宣传的传播方式。
      高质量发展:
        definition: 以创新、协调、绿色、开放、共享为核心的新发展理念。
