      棉纺织及印染精加工:
        definition: 棉、棉型化纤（化纤短丝）纺织及印染精加工。
        source: 国民经济行业分类注释
      化纤织造及印染精加工:
        definition: 经纬双向或经向以化纤长丝(不包括化纤短纤)为主要原料生产的机织物。
        source: 国民经济行业分类注释
      机织服装制造:
        definition: 以机织面料为主要原料，缝制各种男、女服装，以及儿童成衣的活动；包括非自产原料制作的服装，以及固定生产地点的服装制作活动。
        source: 国民经济行业分类注释
      针织或钩针编织服装制造:
        definition: 以针织、钩针编织面料为主要原料，经裁剪后缝制各种男、女服装，以及儿童成衣的活动。
        source: 国民经济行业分类注释
      服饰制造:
        definition: 帽子、手套、围巾、领带、领结、手绢，以及袜子等服装饰品的加工。
        source: 国民经济行业分类注释
      合成纤维制造:
        definition: 以石油、天然气、煤等为主要原料，用有机合成的方法制成单体，聚合后经纺丝加工生产纤维的活动。
        source: 国民经济行业分类注释
