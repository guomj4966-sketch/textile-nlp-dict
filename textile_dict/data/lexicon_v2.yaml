      9_国民经济行业分类 / 纺织业(17):
        棉纺纱加工:
          definition: 指以棉及棉型化学纤维为主要原料进行的纺纱加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1711'
        棉织造加工:
          definition: 指以棉纱、混纺纱、化学纤维纱为主要原料进行的机织物织造加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1712'
        棉印染精加工:
          definition: 指对非自产的棉和化学纤维织物进行漂白、染色、印花、轧光、起绒、缩水等工序的加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1713'
        毛条和毛纱线加工:
          definition: 指以毛及毛型化学纤维为原料进行梳条的加工，按毛纺工艺（精梳、粗梳、半精梳）进行纺纱的加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1721'
        毛织造加工:
          definition: 指毛及毛型化学纤维纱线为原料进行的机织物织造加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1722'
        毛染整精加工:
          definition: 指对非自产的毛织物进行漂白、染色、印花等工序的染整精加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1723'
        麻纤维纺前加工和纺纱:
          definition: 指以苎麻、亚麻、大麻、黄麻、剑麻、罗布麻等为原料的纺前纤维加工和纺纱加工
          source: 国民经济行业分类(GBT4754-2017)
          code: '1731'
        麻织造加工:
          definition: 指以苎麻、亚麻、大麻、黄麻、剑麻、罗布麻纤维纱线等为主要原料的机织物织造加工
